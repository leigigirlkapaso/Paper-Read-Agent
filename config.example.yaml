# ── 0. 服务器配置 ──────────────────────────────────────────
server:
  host: "0.0.0.0"
  port: 8000
  secret_key: ""   # 留空则首次启动自动生成

# ============================================================
#  PaperReadAgent 总配置文件
#  所有参数集中在此，运行前请先填写 llm 和 research 两节
# ============================================================

# ── 全局联系邮箱（用于所有 HTTP UA 与 Unpaywall API）
# 强烈建议填写真实邮箱以降低 DBLP/arxiv 限流概率。
contact_email: ""

# ── 0. 核心层配置（模块化平台共享）───────────────────────────
core:
  llm:
    # 默认沿用顶层 llm: 块，可在此覆盖
    api_base_url: "https://api.deepseek.com/v1"
    api_key: "sk-YOUR_API_KEY_HERE"
    model_name: "deepseek-v4-pro"
    temperature: 0.3
    embedding_model: "BAAI/bge-m3"

  knowledge:
    embedding_model: "BAAI/bge-m3"
    embedding_provider: "local"

  scheduler:
    timezone: "Asia/Shanghai"

  voice:
    api_base_url: "https://api.gpt.ge/v1"
    api_key: "sk-YOUR_API_KEY_HERE"
    stt_model: "whisper-large-v3"
    tts_model: "gemini-2.5-pro-preview-tts"
    tts_voice: "achird"
    tts_speed: 1.0
    stt_language: ""   # 留空则 Whisper 自动检测语言，填入 "zh"/"en" 等强制指定

# ── 1. 大语言模型配置 ──────────────────────────────────────
llm:
  # api_base_url: "https://api.gpt.ge/v1/"   # 兼容 OpenAI 格式的任意接口
  api_base_url: "https://api.deepseek.com/v1"
  api_key: "sk-YOUR_API_KEY_HERE"                            # 你的 API Key
  model_name: "deepseek-v4-pro"                         # 模型名称
  temperature: 0.3
  # max_tokens 不在此处设置，由 AGENT2 根据输入长度动态控制

# ── 2. 研究构想 & 检索参数 ──────────────────────────────────
research:
  topic: |
    在此填写你的研究构想。
    可以是多行，越详细检索效果越好。系统会围绕这个主题去检索、筛选、精读论文。
    建议 200-500 字，涵盖研究背景、核心问题、方法思路。



  max_search_results: 300      # arxiv 每条 query 返回的候选文献数量上限（最大 300）
  min_search_results: 200      # 期望的最小候选总量；不足时自动启用 fallback query 补充
  max_queries: 16              # 最多执行的 query 数量（匹配 LLM 4角度×4维度=16条）
  query_delay: 5               # 每条 query 之间的等待秒数（arxiv 限流严格，需要较大间隔）
  arxiv_page_delay: 2          # arxiv 翻页间隔秒数（arxiv.Client 内部 delay_seconds）
  max_download_papers: 200     # 经 AGENT1 筛选后，最多下载的文献数量
  relevance_threshold: 0.8    # 相关性分数阈值（0~1），低于此值的文献被过滤
  search_batch_size: 5       # AGENT1 筛选时每批处理的文献数量（控制 token）
  filter_max_concurrent: 200 # AGENT1 筛选打分并发上限（批次级别）
  sort_by: "date"             # 检索结果排序方式：date=按发表时间降序（最新优先）| relevance=按相关性
  min_year: 2024              # 过滤掉早于此年份的论文（设为 0 则不过滤）

  # 引文滚雪球（召回增强）：从高相关种子双向扩展 1 跳引文
  enable_citation_snowball: true      # 总开关
  snowball_seed_count: 8              # 取筛选后 top-N 作种子
  snowball_per_seed_per_direction: 25 # 每种子 backward/forward 各最多取多少
  snowball_max_neighbors: 300         # 去重前邻居全局上限（控成本）
  snowball_extra_slots: 10            # 额外精读名额（20 -> 30）
  snowball_quality_weight: 0.15       # 重打分时引用数加权（仅作用于滚雪球候选）

  # Hybrid 粗排（dense bge-m3 + BM25 RRF）：在 LLM 精排前削减候选池
  enable_hybrid_prefilter: true       # 总开关
  prefilter_top_k: 150                # 粗排后送进 LLM 精排的候选数
  prefilter_min_input: 60             # 候选数 ≤ 此值则跳过粗排
  prefilter_dense_weight: 0.5         # RRF 内 dense 权重（0=纯BM25, 1=纯dense, 0.5=对等）
  prefilter_embed_concurrency: 16     # embed 并发上限
  prefilter_passage_chars: 1500       # passage 中 abstract 的截断字符数

# ── 3. 并发参数 ─────────────────────────────────────────────
concurrency:
  max_concurrent: 100         # AGENT2 最大并发数

# ── 4. 多平台检索来源配置 ────────────────────────────────────
# 三平台检索：arxiv + OpenAlex + DBLP，覆盖所有学科
# arxiv: CS/物理/数学主力源（免费，无需 API Key）
# OpenAlex: 2.5 亿+ 文献兜底（免费，无需 API Key）
# DBLP: CS 顶会/期刊（默认关闭，HCI/CHI/UIST 等非 arXiv 学科建议开启）
sources:
  arxiv: true                  # arxiv 检索（免费，无需 API Key）

  openalex: true               # OpenAlex（2.5 亿+ 文献，免费兜底）
  oa_max_per_query: 100        # 每条 query 最多取 100 篇
  oa_query_delay: 2.0          # 每条 query 间隔秒数

  dblp: true                   # DBLP（CS 顶会/期刊，覆盖 HCI 等非 arXiv 学科）
  dblp_max_per_query: 100      # 每条 query 最多取 100 篇（上限 1000）
  dblp_query_delay: 3.0        # 每条 query 间隔秒数（DBLP 限流严格，<3s 会触发 IP 拉黑）

  pmc: true                     # Europe PMC（生物医学，4200 万+ 论文，免费无需 Key）
  pmc_max_per_query: 100        # 每条 query 最多取 100 篇
  pmc_query_delay: 1.0          # 每条 query 间隔秒数

  openreview: true              # OpenReview（CoRL/ICLR/NeurIPS/ICML，含 reject 论文）
  or_max_per_query: 50
  or_query_delay: 1.0           # 限流由 rate_limiter 接管（参数保留兼容）

  crossref: true                # CrossRef（DOI 全覆盖：IEEE/IJRR/Sage/Springer/Elsevier）
  crossref_max_per_query: 100
  crossref_query_delay: 0.5

  # CORE API key（免费申请：https://core.ac.uk/services/api）—— abstract_resolver 第 3 层 fallback
  # 留空则禁用 CORE 层；OpenAlex + S2（前两层）仍正常工作
  core_api_key: ""

# ── 5. 多源下载配置 ────────────────────────────────────────
downloader:
  max_concurrent: 4                # arxiv 限流严格，4 是稳定上限（请勿调大）

  # Unpaywall: 需要提供邮箱以获得免费 API 访问
  # 免费申请：https://unpaywall.org/products/api
  unpaywall_email: ""              # 留空则跳过 Unpaywall

  # Sci-Hub: 最后兜底方案，默认关闭
  enable_scihub: false
  scihub_mirrors:
    - "https://sci-hub.se"
    - "https://sci-hub.st"
    - "https://sci-hub.ru"

# ── 6. PDF 解析参数 ──────────────────────────────────────────
pdf:
  max_chars: 110000            # 送入 LLM 的最大字符数（超出则截断保留摘要+引言+结论）

# ── 7. AGENT2 总结 Prompt ────────────────────────────────────
# 你可以自由修改以下 prompt，系统会将它拼接到每篇论文内容前发给大模型
# summary_prompt: |
#   你是一位资深的科研助理，请对下面提供的论文内容进行结构化分析。
#   严格按照以下 6 个维度输出，使用 Markdown 加粗标题，用中文回答，每个维度不少于 300 字，其中主要方法不少于800字，而与我研究的关联需要进行详细阐述，不少于1000字：
#
#   **研究问题**：该论文试图解决什么核心问题或填补什么研究空白？
#   **主要方法**：采用了哪些关键技术、模型架构或算法？
#   **核心贡献**：与已有工作相比，最重要的创新点是什么？
#   **实验结果**：关键定量指标和定性结论是什么？
#   **局限性**：作者承认或你认为存在哪些不足与未来方向？
#   **与我研究的关联**：结合用户的研究构想，该论文对其有何具体参考价值？如何使用这篇论文的方法对我的研究进行改善？
#
#   注意：只输出这 6 个维度的内容，不要有额外的前言或总结段落。

summary_prompt: |
  你是一位资深科研助理，擅长“文献精读 + 研究对齐 + 申博定位”，并且尤其擅长从论文的用户研究中提炼可迁移的设计洞察与评估范式。请对下面提供的论文内容进行结构化分析，并重点阐释该论文如何帮助我把自己的研究摘要与目标导师的研究方向（即这篇论文）建立清晰、可操作的连接。

  严格按照以下 7 个维度输出，使用 Markdown 加粗标题，用中文回答，不要输出任何前言或结语。

  **研究问题**（不少于 300 字）：该论文试图解决什么核心问题、研究动机是什么、对应的研究空白是什么？

  **主要方法**（不少于 800 字）：详细说明方法框架、关键模块、输入输出、训练/优化策略、与基线方法的差异，以及该方法的可复现要点。

  **核心贡献**（不少于 300 字）：归纳最有价值的技术创新与学术贡献，区分“概念创新”“方法创新”“实验创新”。

  **实验结果**（不少于 800 字）：总结关键定量结果、对比基线、消融实验、泛化能力与统计显著性（若文中提供）。

  **局限性**（不少于 300 字）：分析该工作的边界条件、潜在失败场景、数据/评估不足，以及可行的改进方向。

  **与我研究的关联（含用户研究专项分析）**（不少于 1200 字）：该维度是本次分析的重中之重。你必须将论文中的用户研究作为核心线索，将我的研究构想与论文进行深度对齐。请务必包含以下四个部分，并明确标明序号：
  1. 该用户研究解决论文中的什么问题：说明该用户研究在整个研究中的定位与目的，它要验证什么假设、填补什么证据链、支撑什么主张。
  2. 用户研究的具体内容：详细描述实验设计（如参与者数量与背景、分组方式、任务流程、操作定义）、测量指标（主观/客观、定量/定性）、数据分析方法以及核心发现与结论。
  3. 该用户研究可以怎样迁移到我的研究中：给出具体迁移方案，包括可以复用的实验范式、评估维度、问卷题项、半结构化访谈提纲、数据分析脚本思路，以及需要根据我的研究场景（用户群体、任务类型、技术接口）进行调整的关键点。
  4. 从该用户研究中提取我可能感兴趣的深层内容：主动挖掘该用户研究中隐含的、未充分展开但对我有启发价值的点，例如：结果的替代解读、可迁移的实验控制手段、用户行为中暴露出的新研究问题、评估中可复用的效度/信度检验方式、跨领域迁移的潜在场景等。
  在完成以上四点分析后，进一步说明：该论文哪些思路可直接借鉴、哪些方法组件可迁移、哪些实验设计可在我研究中落地，并给出“短期可实现改进”和“中长期研究扩展”的明确建议。如果论文未报告用户研究，你必须明确指出这一点，并讨论缺失用户研究带来的限制，同时尝试从实验部分或系统评估中提取可替代的实证成分，再给出对我的研究的启示。

  **与我研究的相结合的可能性**（不少于 300 字）：基于以上全部分析，如果我的研究与该论文合作开展，能形成什么新研究问题、新方法或新应用场景，可能的研究合作框架与预期价值是什么。