<!-- Chat Tab: Uses Alpine component thinkerChat() -->
<div class="flex-1 flex flex-col" x-data="thinkerChat()" x-init="initChat()">
    <!-- Conversation selector -->
    <div class="flex items-center gap-3 px-2 pb-3 border-b border-gray-100">
        <select x-model="conversationId" @change="loadMessages()"
                class="text-sm border rounded-lg px-3 py-1.5 bg-white">
            <template x-for="c in conversations" :key="c.id">
                <option :value="c.id" x-text="c.title || '对话 ' + c.id"></option>
            </template>
        </select>
        <select x-model="mode" @change="updateMode()"
                class="text-sm border rounded-lg px-3 py-1.5 bg-white">
            <option value="chat">chat</option>
            <option value="socratic">socratic</option>
            <option value="feynman">feynman</option>
            <option value="kpt">kpt</option>
            <option value="orid">orid</option>
        </select>
        <button @click="newConversation()"
                class="text-sm text-indigo-600 hover:text-indigo-800">+ 新对话</button>
        <button @click="endSession()"
                class="text-sm text-gray-400 hover:text-red-500 ml-auto">结束对话</button>
    </div>

    <!-- Messages -->
    <div class="flex-1 overflow-y-auto p-4 space-y-3" x-ref="msgContainer">
        <template x-for="(msg, i) in messages" :key="i">
            <div :class="msg.role === 'user' ? 'flex justify-end' : 'flex justify-start'">
                <div :class="msg.role === 'user'
                    ? 'bg-indigo-100 text-gray-900 rounded-xl rounded-br-sm max-w-[65%] px-4 py-2.5'
                    : 'bg-white border border-gray-200 rounded-xl rounded-bl-sm max-w-[65%] px-4 py-2.5'">
                    <div x-show="msg.role === 'assistant'" x-html="renderMarkdown(msg.content)"></div>
                    <div x-show="msg.role === 'user'" x-text="msg.content"></div>
                    <span x-show="msg.streaming" class="inline-block w-2 h-4 bg-indigo-400 animate-pulse rounded-sm ml-0.5 align-text-bottom"></span>
                    <button x-show="!msg.streaming && msg.role === 'assistant' && msg.id"
                            @click="playTTS(msg.id)"
                            class="text-xs text-gray-400 hover:text-gray-600 mt-1 block">🔊</button>
                </div>
            </div>
        </template>
    </div>

    <!-- Input -->
    <div class="border-t border-gray-200 pt-3 flex gap-2 items-end">
        <button @click="toggleRecording()"
                :class="recording ? 'bg-red-100 text-red-600 animate-pulse' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'"
                class="w-10 h-10 rounded-full flex items-center justify-center text-lg flex-shrink-0 transition-colors">
            🎤
        </button>
        <textarea x-model="input" @keydown.enter.prevent="if(!$event.shiftKey) send()"
                  placeholder="输入消息... (Enter 发送, Shift+Enter 换行)"
                  rows="1" class="flex-1 border border-gray-200 rounded-lg px-3 py-2 text-sm resize-none focus:ring-2 focus:ring-indigo-300 focus:border-indigo-500 outline-none"
                  style="min-height:40px;max-height:160px;"></textarea>
        <button @click="send()" :disabled="loading || !input.trim()"
                class="bg-indigo-600 text-white px-5 py-2 rounded-lg hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed font-medium text-sm flex-shrink-0">
            发送
        </button>
    </div>
</div>
