<!-- Four-part summary (shared between rehearsal completed view and records detail modal) -->

<!-- Part 1: Verbatim Transcript -->
<div class="mb-6">
    <h3 class="text-sm font-semibold mb-2 flex items-center gap-2">
        <span class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded text-xs">第一部分</span>
        逐字对话记录
    </h3>
    <details class="bg-gray-50 border border-gray-200 rounded-lg">
        <summary class="px-4 py-2 cursor-pointer text-sm text-gray-600 hover:text-gray-900">展开查看完整记录</summary>
        <div class="px-4 pb-4">
            <h4 class="text-xs font-medium text-gray-500 mt-3 mb-1">🎤 Presentation</h4>
            <pre x-text="summaryData.part1_transcript?.presentation || ''" class="text-xs whitespace-pre-wrap font-sans text-gray-700 max-h-64 overflow-y-auto"></pre>
            <h4 class="text-xs font-medium text-gray-500 mt-3 mb-1">🤖 Q&A</h4>
            <pre x-text="summaryData.part1_transcript?.qa || ''" class="text-xs whitespace-pre-wrap font-sans text-gray-700 max-h-64 overflow-y-auto"></pre>
        </div>
    </details>
</div>

<!-- Part 2: Briefing -->
<div class="mb-6">
    <h3 class="text-sm font-semibold mb-2 flex items-center gap-2">
        <span class="bg-amber-100 text-amber-800 px-2 py-0.5 rounded text-xs">第二部分</span>
        对话简报
    </h3>
    <div class="bg-amber-50 border border-amber-200 rounded-lg px-4 py-3 text-sm leading-relaxed"
         x-text="summaryData.part2_briefing || '暂无简报'"></div>
</div>

<!-- Part 3: Grammar Corrections -->
<div class="mb-6">
    <h3 class="text-sm font-semibold mb-2 flex items-center gap-2">
        <span class="bg-pink-100 text-pink-800 px-2 py-0.5 rounded text-xs">第三部分</span>
        语法纠正
    </h3>
    <div x-show="!summaryData.part3_grammar_corrections || summaryData.part3_grammar_corrections.length === 0"
         class="text-sm text-gray-400">无语法错误 🎉</div>
    <template x-for="item in summaryData.part3_grammar_corrections" :key="item.id">
        <div class="bg-white border border-gray-200 rounded-lg px-4 py-3 mb-2 text-sm">
            <div class="flex gap-3 flex-wrap">
                <span class="text-red-500 line-through" x-text="item.original"></span>
                <span class="text-gray-400">→</span>
                <span class="text-green-600 font-medium" x-text="item.corrected"></span>
            </div>
            <p class="text-xs text-gray-500 mt-1" x-text="item.note"></p>
        </div>
    </template>
</div>

<!-- Part 4: Suggestions -->
<div class="mb-6">
    <h3 class="text-sm font-semibold mb-2 flex items-center gap-2">
        <span class="bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded text-xs">第四部分</span>
        演讲建议
    </h3>
    <template x-for="item in summaryData.part4_suggestions" :key="item.id">
        <div class="border-l-2 mb-3 pl-4"
             :class="{
                'border-indigo-400': item.category === '内容建议',
                'border-purple-400': item.category === '表达建议',
                'border-cyan-400': item.category === '优化示范'
             }">
            <span class="text-xs font-medium px-1.5 py-0.5 rounded"
                  :class="{
                    'bg-indigo-50 text-indigo-700': item.category === '内容建议',
                    'bg-purple-50 text-purple-700': item.category === '表达建议',
                    'bg-cyan-50 text-cyan-700': item.category === '优化示范'
                  }"
                  x-text="item.category"></span>
            <p class="text-sm font-medium mt-1" x-text="item.issue"></p>
            <p class="text-sm text-gray-600 mt-0.5" x-text="item.suggestion"></p>
            <p x-show="item.example" class="text-xs text-gray-500 mt-1 bg-gray-50 rounded px-2 py-1 font-mono"
               x-text="'💡 ' + item.example"></p>
        </div>
    </template>
</div>
