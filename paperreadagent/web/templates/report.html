{% extends "base.html" %}
{% block title %}报告 — Session #{{ session.id }}{% endblock %}

{% block content %}
<div class="mb-6">
    <a href="/sessions/{{ session.id }}" class="text-sm text-gray-500 hover:text-indigo-600">← Session #{{ session.id }}</a>
    <h1 class="text-2xl font-bold mt-1">文献调研报告</h1>
    <p class="text-sm text-gray-500">{{ project.name }} · Session #{{ session.id }}</p>
</div>

{% if report_content %}
<div class="bg-white rounded-xl shadow-sm border p-8">
    <div id="report-html" class="prose max-w-none"></div>
</div>

<script>
    document.getElementById('report-html').innerHTML = DOMPurify.sanitize(marked.parse(
        {{ report_content | tojson }}
    ));
</script>
{% else %}
<div class="text-center py-20 text-gray-400">
    <p class="text-lg">报告尚未生成。</p>
    <p class="text-sm mt-2">请运行完整模式或分析模式来生成文献调研报告。</p>
</div>
{% endif %}
{% endblock %}
