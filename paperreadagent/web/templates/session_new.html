{% extends "base.html" %}
{% block title %}新建调研 — {{ project.name }}{% endblock %}

{% block content %}
<div class="mb-6">
    <a href="/projects/{{ project.id }}" class="text-sm text-gray-500 hover:text-indigo-600">← {{ project.name }}</a>
    <h1 class="text-2xl font-bold mt-1">新建文献调研</h1>
</div>

<form method="post" action="/sessions/start/{{ project.id }}"
      x-data="configForm()" class="space-y-6">
    <!-- Mode selection -->
    <div class="bg-white rounded-xl shadow-sm border p-5">
        <h2 class="font-semibold mb-3">运行模式</h2>
        <div class="flex gap-4">
            <label class="flex items-center gap-2 cursor-pointer">
                <input type="radio" name="mode" value="full" checked class="text-indigo-600">
                <span>完整模式（搜索+下载+分析）</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
                <input type="radio" name="mode" value="collect" class="text-indigo-600">
                <span>仅搜集（搜索+下载）</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
                <input type="radio" name="mode" value="analyze" class="text-indigo-600">
                <span>仅分析（本地PDF）</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
                <input type="radio" name="mode" value="incremental" class="text-indigo-600">
                <span>增量更新（仅新论文）</span>
            </label>
        </div>
        <div class="mt-2 text-xs text-gray-400">
            <p>复用已有 session：输入 session ID 可直接分析其 papers/ 目录（需配合仅分析模式）</p>
        </div>
    </div>

    <!-- Research Topic -->
    <div class="bg-white rounded-xl shadow-sm border p-5 config-form">
        <h2 class="font-semibold mb-3">研究构想</h2>
        <textarea name="topic" x-model="topic" rows="5"
                  class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-300 focus:border-indigo-500 outline-none"
                  placeholder="用中英文描述你的研究构想、初步摘要或研究问题..."></textarea>
    </div>

    <!-- Config Options -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-white rounded-xl shadow-sm border p-5 config-form">
            <h3 class="font-semibold mb-3 text-sm">LLM 配置</h3>
            <label class="text-xs">API Base URL</label>
            <input type="text" x-model="api_base_url" class="w-full border rounded px-2 py-1 text-sm mb-2">
            <label class="text-xs">API Key</label>
            <input type="password" x-model="api_key" class="w-full border rounded px-2 py-1 text-sm mb-2">
            <label class="text-xs">Model</label>
            <input type="text" x-model="model_name" class="w-full border rounded px-2 py-1 text-sm mb-2">
            <label class="text-xs">Temperature</label>
            <input type="number" x-model="temperature" step="0.1" min="0" max="2" class="w-full border rounded px-2 py-1 text-sm">
        </div>

        <div class="bg-white rounded-xl shadow-sm border p-5 config-form">
            <h3 class="font-semibold mb-3 text-sm">检索参数</h3>
            <label class="text-xs">每 query 上限</label>
            <input type="number" x-model="max_search_results" class="w-full border rounded px-2 py-1 text-sm mb-2">
            <label class="text-xs">最小候选量</label>
            <input type="number" x-model="min_search_results" class="w-full border rounded px-2 py-1 text-sm mb-2">
            <label class="text-xs">最大 query 数</label>
            <input type="number" x-model="max_queries" class="w-full border rounded px-2 py-1 text-sm mb-2">
            <label class="text-xs">相关性阈值</label>
            <input type="number" x-model="relevance_threshold" step="0.05" min="0" max="1" class="w-full border rounded px-2 py-1 text-sm mb-2">
            <label class="text-xs">最早年份</label>
            <input type="number" x-model="min_year" class="w-full border rounded px-2 py-1 text-sm">
        </div>

        <div class="bg-white rounded-xl shadow-sm border p-5 config-form">
            <h3 class="font-semibold mb-3 text-sm">并发 & PDF</h3>
            <label class="text-xs">最大并发数</label>
            <input type="number" x-model="max_concurrent" class="w-full border rounded px-2 py-1 text-sm mb-2">
            <label class="text-xs">PDF 最大字符数</label>
            <input type="number" x-model="max_chars" class="w-full border rounded px-2 py-1 text-sm mb-2">
            <label class="text-xs">最多下载篇数</label>
            <input type="number" x-model="max_download_papers" class="w-full border rounded px-2 py-1 text-sm mb-2">
            <label class="text-xs">排序方式</label>
            <select x-model="sort_by" class="w-full border rounded px-2 py-1 text-sm">
                <option value="date">按时间</option>
                <option value="relevance">按相关性</option>
            </select>
        </div>
    </div>

    <!-- Summary Prompt -->
    <div class="bg-white rounded-xl shadow-sm border p-5 config-form">
        <h2 class="font-semibold mb-3">总结 Prompt</h2>
        <textarea name="summary_prompt" x-model="summary_prompt" rows="6"
                  class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-300 focus:border-indigo-500 outline-none font-mono"></textarea>
    </div>

    <!-- Source toggles -->
    <div class="bg-white rounded-xl shadow-sm border p-5">
        <h2 class="font-semibold mb-3">检索来源</h2>
        <div class="flex gap-6">
            <label class="flex items-center gap-2 cursor-pointer text-sm">
                <input type="checkbox" x-model="source_arxiv" checked class="text-indigo-600"> arxiv
            </label>
            <label class="flex items-center gap-2 cursor-pointer text-sm">
                <input type="checkbox" x-model="source_s2" class="text-indigo-600"> Semantic Scholar
            </label>
            <label class="flex items-center gap-2 cursor-pointer text-sm">
                <input type="checkbox" x-model="source_pwc" class="text-indigo-600"> Papers With Code
            </label>
            <label class="flex items-center gap-2 cursor-pointer text-sm">
                <input type="checkbox" x-model="source_oa" class="text-indigo-600"> OpenAlex
            </label>
        </div>
    </div>

    <!-- Hidden: assembled YAML -->
    <input type="hidden" name="config_yaml" :value="assembledYaml()">

    <div class="flex gap-3">
        <button type="submit"
                class="bg-indigo-600 text-white px-8 py-3 rounded-lg hover:bg-indigo-700 font-medium">
            🚀 启动调研
        </button>
        <a href="/projects/{{ project.id }}" class="text-gray-500 px-4 py-3 hover:text-gray-700">取消</a>
    </div>
</form>

{% block scripts %}
<script>
function configForm() {
    const _defaults = {{ form_defaults_json | safe }};
    return {
        topic: _defaults.topic || '在此填写你的研究构想...',
        api_base_url: _defaults.api_base_url || 'https://api.deepseek.com',
        api_key: _defaults.api_key || 'sk-YOUR_API_KEY_HERE',
        model_name: _defaults.model_name || 'deepseek-v4-pro',
        temperature: _defaults.temperature ?? 0.3,
        max_search_results: _defaults.max_search_results || 100,
        min_search_results: _defaults.min_search_results || 200,
        max_queries: _defaults.max_queries || 8,
        query_delay: _defaults.query_delay || 8,
        relevance_threshold: _defaults.relevance_threshold ?? 0.6,
        max_download_papers: _defaults.max_download_papers || 50,
        min_year: _defaults.min_year || 2022,
        sort_by: _defaults.sort_by || 'date',
        max_concurrent: _defaults.max_concurrent || 100,
        max_chars: _defaults.max_chars || 80000,
        summary_prompt: _defaults.summary_prompt || `你是一位资深科研助理，擅长"文献精读 + 研究对齐 + 申博定位"，并且尤其擅长从论文的用户研究中提炼可迁移的设计洞察与评估范式。请对下面提供的论文内容进行结构化分析，并重点阐释该论文如何帮助我把自己的研究摘要与目标导师的研究方向（即这篇论文）建立清晰、可操作的连接。

严格按照以下 7 个维度输出，使用 Markdown 加粗标题，用中文回答，不要输出任何前言或结语。

**研究问题**（不少于 300 字）：该论文试图解决什么核心问题、研究动机是什么、对应的研究空白是什么？

**主要方法**（不少于 800 字）：详细说明方法框架、关键模块、输入输出、训练/优化策略、与基线方法的差异，以及该方法的可复现要点。

**核心贡献**（不少于 300 字）：归纳最有价值的技术创新与学术贡献，区分"概念创新""方法创新""实验创新"。

**实验结果**（不少于 800 字）：总结关键定量结果、对比基线、消融实验、泛化能力与统计显著性（若文中提供）。

**局限性**（不少于 300 字）：分析该工作的边界条件、潜在失败场景、数据/评估不足，以及可行的改进方向。

**与我研究的关联（含用户研究专项分析）**（不少于 1200 字）：该维度是本次分析的重中之重。你必须将论文中的用户研究作为核心线索，将我的研究构想与论文进行深度对齐。请务必包含以下四个部分，并明确标明序号：
1. 该用户研究解决论文中的什么问题：说明该用户研究在整个研究中的定位与目的，它要验证什么假设、填补什么证据链、支撑什么主张。
2. 用户研究的具体内容：详细描述实验设计（如参与者数量与背景、分组方式、任务流程、操作定义）、测量指标（主观/客观、定量/定性）、数据分析方法以及核心发现与结论。
3. 该用户研究可以怎样迁移到我的研究中：给出具体迁移方案，包括可以复用的实验范式、评估维度、问卷题项、半结构化访谈提纲、数据分析脚本思路，以及需要根据我的研究场景（用户群体、任务类型、技术接口）进行调整的关键点。
4. 从该用户研究中提取我可能感兴趣的深层内容：主动挖掘该用户研究中隐含的、未充分展开但对我有启发价值的点，例如：结果的替代解读、可迁移的实验控制手段、用户行为中暴露出的新研究问题、评估中可复用的效度/信度检验方式、跨领域迁移的潜在场景等。
在完成以上四点分析后，进一步说明：该论文哪些思路可直接借鉴、哪些方法组件可迁移、哪些实验设计可在我研究中落地，并给出"短期可实现改进"和"中长期研究扩展"的明确建议。如果论文未报告用户研究，你必须明确指出这一点，并讨论缺失用户研究带来的限制，同时尝试从实验部分或系统评估中提取可替代的实证成分，再给出对我的研究的启示。

**与我研究的相结合的可能性**（不少于 300 字）：基于以上全部分析，如果我的研究与该论文合作开展，能形成什么新研究问题、新方法或新应用场景，可能的研究合作框架与预期价值是什么。`,
        source_arxiv: true,
        source_s2: false,
        source_pwc: false,
        source_oa: false,
        assembledYaml() {
            let topic = this.topic.replace(/\n/g, '\n    ');
            let sp = this.summary_prompt.replace(/\n/g, '\n    ');
            return `llm:\n  api_base_url: "${this.api_base_url}"\n  api_key: "${this.api_key}"\n  model_name: "${this.model_name}"\n  temperature: ${this.temperature}\n\nresearch:\n  topic: |\n    ${topic}\n  max_search_results: ${this.max_search_results}\n  min_search_results: ${this.min_search_results}\n  max_queries: ${this.max_queries}\n  query_delay: ${this.query_delay}\n  max_download_papers: ${this.max_download_papers}\n  relevance_threshold: ${this.relevance_threshold}\n  search_batch_size: 10\n  sort_by: "${this.sort_by}"\n  min_year: ${this.min_year}\n\nconcurrency:\n  max_concurrent: ${this.max_concurrent}\n\nsources:\n  arxiv: ${this.source_arxiv}\n  semantic_scholar: ${this.source_s2}\n  papers_with_code: ${this.source_pwc}\n  openalex: ${this.source_oa}\n  s2_api_key: ""\n  s2_max_per_query: 100\n  s2_query_delay: 3.0\n  pwc_max_per_query: 100\n  pwc_query_delay: 2.0\n  oa_max_per_query: 100\n  oa_query_delay: 2.0\n\npdf:\n  max_chars: ${this.max_chars}\n\nsummary_prompt: |\n    ${sp}\n`;
        }
    }
}
</script>
{% endblock %}
{% endblock %}
