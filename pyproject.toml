[project]
name = "paperreadagent"
version = "0.1.0"
description = "自动文献调研多智能体系统：关键词提取 → arxiv检索筛选 → 并发精读 → 综述报告"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.5",
    "apscheduler>=3.10.0",
    "av>=14.0.0",
    "arxiv>=3.0.0",
    "fastapi>=0.136.1",
    "jinja2>=3.1.6",
    "lancedb>=0.33.0",
    "markdown>=3.10.2",
    "markdownify>=0.11.0",
    "numpy>=2.0.0",
    "openai>=2.32.0",
    "pymupdf>=1.27.2.2",
    "pymupdf4llm>=1.27.2.2",
    "python-multipart>=0.0.27",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.4.1",
    "starlette<1.0",
    "tqdm>=4.67.3",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["paperreadagent"]
